<div class="container mt-4">
  <h2>{{ isEdit ? 'Editar' : 'Crear' }} Ticket</h2>

  <form (ngSubmit)="onSubmit()" #ticketForm="ngForm">
    <div class="mb-3">
      <label for="titulo" class="form-label">Título</label>
      <input type="text" class="form-control" id="titulo" name="titulo"
             [(ngModel)]="ticket.titulo" required minlength="5">
    </div>

    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <textarea class="form-control" id="descripcion" name="descripcion"
                [(ngModel)]="ticket.descripcion" required rows="4"></textarea>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="categoria" class="form-label">Categoría</label>
        <select class="form-select" id="categoria" name="categoria"
                [(ngModel)]="ticket.categoria" required>
          <option value="hardware">Hardware</option>
          <option value="red">Red</option>
          <option value="software">Software</option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label for="prioridad" class="form-label">Prioridad</label>
        <select class="form-select" id="prioridad" name="prioridad"
                [(ngModel)]="ticket.prioridad" required>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>

      <div class="col-md-4 mb-3" *ngIf="isEdit">
        <label for="estado" class="form-label">Estado</label>
        <select class="form-select" id="estado" name="estado"
                [(ngModel)]="ticket.estado" required>
          <option value="abierto">Abierto</option>
          <option value="en progreso">En progreso</option>
          <option value="resuelto">Resuelto</option>
          <option value="cerrado">Cerrado</option>
        </select>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="ticketForm.invalid">
        {{ isEdit ? 'Actualizar' : 'Crear' }}
      </button>
      <button type="button" class="btn btn-secondary" routerLink="/tickets">Cancelar</button>
    </div>
  </form>
</div>
