<div class="container mt-4">
  <h2>Lista de Tickets</h2>
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="!loading && tickets.length === 0" class="alert alert-info">
    No hay tickets registrados.
  </div>

  <div *ngIf="!loading && tickets.length > 0" class="table-responsive">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Categoría</th>
          <th>Prioridad</th>
          <th>Estado</th>
          <th>Fecha</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ticket of tickets">
          <td>{{ ticket._id | slice:0:8 }}</td>
          <td>{{ ticket.titulo }}</td>
          <td>
            <span class="badge bg-secondary">{{ ticket.categoria }}</span>
          </td>
          <td>
            <span class="badge" [class]="getPrioridadClass(ticket.prioridad)">
              {{ ticket.prioridad }}
            </span>
          </td>
          <td>
            <span class="badge" [class]="getEstadoClass(ticket.estado)">
              {{ ticket.estado }}
            </span>
          </td>
          <td>{{ ticket.fechaCreacion | date:'dd/MM/yyyy' }}</td>
          <td>
            <button class="btn btn-sm btn-info me-1" [routerLink]="['/editar', ticket._id]">
              Editar
            </button>
            <button class="btn btn-sm btn-danger" (click)="deleteTicket(ticket._id!)">
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
